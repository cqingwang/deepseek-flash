# =============================================================================
# DeepSeek-V4-Flash 双机集群配置（单一真相源 SSOT）
#
# program.py（唯一实现）读取本文件，按 common / head / worker 分类取值。
# 解析方式：python3 program.py --config <本文件> <命令>（依赖 pyyaml，缺失时提示安装）。
#
# 部署约定：
#   deploy.sh --install 会把本文件与 program.py 同步到双机 /etc/dspark-vllm/；
#   systemd 单元以绝对路径 --config /etc/dspark-vllm/config.yaml 调用 program.py。
#   管理网为 Wi-Fi（wlP9s9）DHCP 动态分配，IP 漂移后请同步更新本文件。
# =============================================================================

# ---------- 通用（common，双机一致） ----------
common:
  user: chan                        # 双机统一用户名（sudo / docker / runuser）
  repo: /opt/deepseek-flash         # 本项目部署根路径（双机）
  runtime_repo: /opt/deepseek-flash/dspark  # MiaAI DSpark 子项目路径（双机）
  project: deepseek-v4-flash        # docker compose 项目名
  container: deepseek-v4-flash-vllm-dspark-1   # 容器名（双机各自同名）
  model_lib: /opt/models            # 宿主模型库根目录（各模型按 <org>/<model> 两级路径存放）
  default_model: /opt/models/drowzeys/keys-DeepSeekV4Flash-Vision-EXP-ablit   # Hugging Face 本地快照目录
  model_variant: abliterated              # gen-env 选择 ABLITERATED=1；下载时固定 abliterated 仓库自身 revision
  model_revision: 48095b3452a17f3e3ae8f77892399389c45de9e1   # drowzeys 当前 HF 提交；本地路径加载时不传给 vLLM
  vllm_image: ghcr.io/anemll/dspark-vllm-gx10:0.1.1   # 运行时镜像
  image_tar: /opt/dspark-vllm-gx10_v0.1.1.tar.gz     # 离线镜像包（受限网络优先 docker load）
  api_url: http://127.0.0.1:8888/v1/models           # 健康检查端点
  api_key: deepseek                                       # vLLM HTTP 服务 API 密钥；空串则关闭鉴权
  sparkdash_url: http://127.0.0.1:5555             # install 时注入 common.api_key 的 SparkDash API
  max_request: 4                                  # 映射到 .env 的 MAX_NUM_SEQS
  max_token: 1048576                               # 映射到 .env 的 MAX_MODEL_LEN
  max_num_batched_tokens: 16384                     # official 默认8192；c=4 保持不变
  mtp_num_tokens: 5                                # official 默认，满足 checkpoint dspark_block_size
  master_port: 25000                # NCCL/分布式 master 端口

# ---------- head 节点（spark-a，主控） ----------
head:
  hostname: spark-a
  management_ip: 192.168.2.180      # 管理网 Wi-Fi（wlP9s9，DHCP）
  management_if: wlP9s9
  fabric_ip: 10.100.240.1           # 集群网链路0（RoCE，主链路）
  fabric_ip2: 10.100.241.1          # 集群网链路1（RoCE，备用/双链路）
  hca: rocep1s0f0                   # RoCE 设备（Port0 链路0）
  ifname: enp1s0f0np0               # RoCE 网口

# ---------- worker 节点（spark-b） ----------
worker:
  hostname: spark-b
  ssh: chan@192.168.2.161           # head 管理 SSH 目标（Wi-Fi DHCP）
  management_ip: 192.168.2.161
  management_if: wlP9s9
  fabric_ip: 10.100.240.2
  fabric_ip2: 10.100.241.2
  hca: rocep1s0f0
  ifname: enp1s0f0np0
